name: commerce-agent

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:?POSTGRES_MIGRATION_USER is required}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
      - -c
      - statement_timeout=10s
    volumes:
      - commerce_agent_pgdata:/var/lib/postgresql
      - ./infra/postgres/init/00-create-roles.sh:/docker-entrypoint-initdb.d/00-create-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
    networks: [backend]

  app:
    image: commerce-agent:phase0
    build: .
    environment:
      APP_ENV: ${APP_ENV:-demo}
      APP_BIND: ${APP_BIND:-0.0.0.0:8000}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MODEL: ${MODEL:?MODEL is required}
      API_BASE: ${API_BASE:?API_BASE is required}
      API_KEY: ${API_KEY:?API_KEY is required}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:?CLASSIFIER_MODEL is required}
      CLASSIFIER_API_BASE: ${CLASSIFIER_API_BASE:?CLASSIFIER_API_BASE is required}
      CLASSIFIER_API_KEY: ${CLASSIFIER_API_KEY:?CLASSIFIER_API_KEY is required}
      CLASSIFIER_TEMPERATURE: ${CLASSIFIER_TEMPERATURE:?CLASSIFIER_TEMPERATURE is required}
      CLASSIFIER_MAX_TOKENS: ${CLASSIFIER_MAX_TOKENS:-1024}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      JUDGE_API_BASE: ${JUDGE_API_BASE:-}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_ACTOR_ALLOWLIST: ${DEMO_ACTOR_ALLOWLIST:-demo-user-001,demo-user-002}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:19473:8000"
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 384M
    networks: [backend, egress]

  migrate:
    image: commerce-agent:phase0
    build: .
    profiles: [maintenance]
    command: ["python", "-m", "src.migrate"]
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL is required}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  seed-knowledge:
    image: commerce-agent:phase0
    build: .
    profiles: [maintenance]
    command: ["python", "scripts/ingest_demo_knowledge.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    internal: true
  egress: {}

volumes:
  commerce_agent_pgdata:
